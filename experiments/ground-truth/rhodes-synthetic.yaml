      - id: GT-RH-15
        type: NO-CALL
        line_range: [27, 35]
        severity: LOW
        description: "OrderValidator uses __call__() making validator(order) ambiguous - is it constructing or validating?"
        guideline: "Avoid __call__() for Readability"
        function: OrderValidator.__call__
