# Reviewer Tags Configuration
#
# Tags are shortcuts to run multiple reviewers at once.
# Each reviewer runs with fresh context, generating separate reports.
#
# Format:
#   tag-name:
#     description: What this tag does
#     reviewers:
#       - reviewer-name-1
#       - reviewer-name-2
#
# Usage:
#   uv run review.py --repo URL --reviewer tag-name --provider claude
#
# Customize this file to create your own tags!

# Language-specific tags
python:
  description: Complete Python code review (7 reviewers)
  reviewers:
    - python-refactoring-reviewer
    - python-functional-reviewer
    - python-zen-reviewer
    - python-format-refactoring-reviewer
    - python-test-reviewer
    - python-security-privacy-reviewer
    - python-performance-reviewer

javascript:
  description: Complete JavaScript/TypeScript code review (7 reviewers)
  reviewers:
    - javascript-test-reviewer
    - javascript-refactoring-reviewer
    - javascript-format-refactoring-reviewer
    - javascript-functional-reviewer
    - javascript-security-privacy-reviewer
    - javascript-performance-reviewer
    - react-reviewer

js:
  description: Alias for javascript
  reviewers:
    - javascript-test-reviewer
    - javascript-refactoring-reviewer
    - javascript-format-refactoring-reviewer
    - javascript-functional-reviewer
    - javascript-security-privacy-reviewer
    - javascript-performance-reviewer
    - react-reviewer

# Quality and style
