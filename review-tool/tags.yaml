# Reviewer Tags Configuration
#
# Tags are shortcuts to run multiple reviewers at once.
# Each reviewer runs with fresh context, generating separate reports.
#
# Format:
#   tag-name:
#     description: What this tag does
#     reviewers:
#       - reviewer-name-1
#       - reviewer-name-2
#
# Usage:
#   uv run review.py --repo URL --reviewer tag-name --provider claude
#
# Customize this file to create your own tags!

# Language-specific tags
python:
  description: Complete Python code review (refactoring, functional patterns, style, tests, security)
  reviewers:
    - refactoring-reviewer
    - functional-python-reviewer
    - zen-of-python-reviewer
    - format-refactoring-reviewer
    - python-test-reviewer
    - security-privacy-reviewer

javascript:
  description: JavaScript/TypeScript functional programming review
  reviewers:
    - functional-javascript-reviewer

js:
  description: Alias for javascript
  reviewers:
    - functional-javascript-reviewer

# Quality and style
quality:
  description: Code quality, style, and refactoring opportunities
  reviewers:
    - refactoring-reviewer
    - zen-of-python-reviewer
    - format-refactoring-reviewer

# Functional programming
functional:
  description: Functional programming patterns for Python and JavaScript
  reviewers:
    - functional-python-reviewer
    - functional-javascript-reviewer

fp:
  description: Alias for functional
  reviewers:
    - functional-python-reviewer
    - functional-javascript-reviewer

# Security and privacy
security:
  description: Security vulnerabilities and privacy issues
  reviewers:
    - security-privacy-reviewer

privacy:
  description: Alias for security
  reviewers:
    - security-privacy-reviewer

# Framework-specific
django:
  description: Django best practices, performance, and security
  reviewers:
    - django-reviewer
    - refactoring-reviewer
    - security-privacy-reviewer
    - python-test-reviewer

# Testing
testing:
  description: Test quality, coverage, and patterns
  reviewers:
    - python-test-reviewer

tests:
  description: Alias for testing
  reviewers:
    - python-test-reviewer

# Documentation
requirements:
  description: Requirements, user stories, and specifications review
  reviewers:
    - agile-requirements-reviewer

docs:
  description: Alias for requirements
  reviewers:
    - agile-requirements-reviewer

# Comprehensive
complete:
  description: All available reviewers (generates 9 reports)
  reviewers:
    - agile-requirements-reviewer
    - django-reviewer
    - format-refactoring-reviewer
    - functional-javascript-reviewer
    - functional-python-reviewer
    - python-test-reviewer
    - refactoring-reviewer
    - security-privacy-reviewer
    - zen-of-python-reviewer

all:
  description: Alias for complete
  reviewers:
    - agile-requirements-reviewer
    - django-reviewer
    - format-refactoring-reviewer
    - functional-javascript-reviewer
    - functional-python-reviewer
    - python-test-reviewer
    - refactoring-reviewer
    - security-privacy-reviewer
    - zen-of-python-reviewer
