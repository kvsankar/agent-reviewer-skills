# Authenticity (AI/LLM code verification)
authenticity:
  description: Detect fabricated, hallucinated, or unearned code assertions
  reviewers:
    - code-authenticity-reviewer

# Comprehensive
complete:
  description: All available reviewers (generates 19 reports)
  reviewers:
    # Python reviewers
    - python-refactoring-reviewer
    - python-functional-reviewer
    - python-zen-reviewer
    - python-format-refactoring-reviewer
    - python-test-reviewer
