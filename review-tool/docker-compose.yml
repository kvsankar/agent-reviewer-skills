# Docker Compose for Claude Code Skills Review Tool
#
# Usage:
#   # Build
#   docker-compose build
#
#   # Run review
#   docker-compose run --rm reviewer \
#     --repo https://github.com/user/repo \
#     --reviewer python \
#     --provider claude \
#     --agentic
#
#   # With environment file
#   docker-compose --env-file .env run --rm reviewer --repo URL --reviewer python --agentic

version: '3.8'

services:
  reviewer:
    build:
      context: ..  # Build from parent directory (claude-skills/)
      dockerfile: review-tool/Dockerfile
    image: claude-reviewer:latest
    container_name: claude-reviewer

    # Run as host user to match file permissions
    # Use USER_ID/GROUP_ID from .env file (avoid UID readonly issue)
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"

    # Mount reviews directory for output (inherits host user permissions)
    volumes:
      - ./reviews:/app/reviews

      # Mount Claude Code credentials for CLI authentication (read-only)
      # This allows using your Claude Code subscription without API key
      - ~/.claude/.credentials.json:/home/appuser/.claude/.credentials.json:ro

      # Mount all reviewer skills (read-only)
      # This eliminates need to rebuild when skills change
      - ../reviewers:/skills:ro

      # Mount the review tool code itself (for development)
      # This allows code changes without rebuilding
      - ./review.py:/app/review.py:ro
      - ./tags.yaml:/app/tags.yaml:ro

    # Environment variables (or use .env file)
    environment:
      # Claude API key (optional if using --use-claude-cli)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # Container detection (already set in Dockerfile)
      - IN_CONTAINER=true

    # Security: run as non-root in production
    # user: "1000:1000"

    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 4G

    # Network isolation (optional - for extra security)
    # network_mode: none

    # Disable network except for API calls (recommended for security)
    # networks:
    #   - review-network

# Optional: Isolated network
# networks:
#   review-network:
#     driver: bridge
